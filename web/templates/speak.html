{% extends "_base.html" %}
{% block content %}
<div class="card">
  <h2>Speak</h2>
  {% if not voices %}
  <p class="muted">No voices enrolled yet. <a href="/enroll">Enroll one first →</a></p>
  {% else %}
  <div class="row">
    <div class="col" style="flex-basis:320px">
      <label for="voice">Voice</label>
      <select id="voice">
        {% for v in voices %}
        <option value="{{ v.key }}">{{ v.display_name }} ({{ v.key }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col" style="flex-basis:160px">
      <label for="tau">Guidance (cfg)</label>
      <input id="tau" type="number" min="0.5" max="6.0" step="0.5" value="3.0">
      <span class="small muted">Higher = closer to you</span>
    </div>
    <div class="col" style="flex-basis:220px">
      <label for="nfe">NFE steps (speed ↔ quality)</label>
      <select id="nfe">
        <option value="12"          > 12 — fastest ⚡⚡⚡</option>
        <option value="16" selected > 16 — best balance ⭐ (first chunk forced to 12 for ~2s TTfA)</option>
        <option value="20"          > 20</option>
        <option value="24"          > 24</option>
        <option value="32"          > 32 — slow</option>
        <option value="48"          > 48 — slowest, best</option>
      </select>
    </div>
    <div class="col" style="flex-basis:120px">
      <label for="speed">Speed</label>
      <input id="speed" type="number" min="0.5" max="2.0" step="0.05" value="1.0">
    </div>
    <div class="col" style="flex-basis:160px">
      <label for="playback">Play on</label>
      <select id="playback">
        <option value="browser" selected>Mac (browser)</option>
        <option value="jetson">Jetson speaker</option>
        <option value="both">Both</option>
      </select>
    </div>
  </div>

  <div style="margin-top:14px">
    <label for="text">Text</label>
    <textarea id="text" maxlength="1000"
      placeholder="Hello from the Jetson Orin Nano. This is a voice clone smoke test."></textarea>
  </div>

  <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
    <button id="synth" class="btn">Synthesize</button>
    <button id="warmup" class="btn secondary small" title="preload MeloTTS + Converter so the first synth is fast">
      warm up models
    </button>
    <span id="timing" class="small muted"></span>
  </div>

  <div id="player-wrap" style="margin-top:18px; display:none">
    <label>Result</label>
    <audio id="player" controls style="width:100%"></audio>
    <p class="small muted" id="player-sub"></p>
  </div>
  {% endif %}
</div>
{% endblock %}

{% block scripts %}
<script>
  // Pre-select voice from ?voice= query param
  const params = new URLSearchParams(location.search);
  const wantedVoice = params.get('voice');
  if (wantedVoice) {
    const sel = document.getElementById('voice');
    if (sel) for (const opt of sel.options) {
      if (opt.value === wantedVoice) { sel.value = wantedVoice; break; }
    }
  }

  const synthBtn = document.getElementById('synth');
  const warmBtn  = document.getElementById('warmup');
  const player   = document.getElementById('player');
  const wrap     = document.getElementById('player-wrap');
  const sub      = document.getElementById('player-sub');
  const timing   = document.getElementById('timing');

  async function postJSON(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({detail: r.statusText}));
      throw new Error(e.detail || r.statusText);
    }
    return r.json();
  }

  // Streaming synth — SSE endpoint yields per-chunk wav_urls.  We
  // queue them and play them back-to-back, so the very first audio
  // starts within ~2 s while later chunks render in the background.
  synthBtn?.addEventListener('click', async () => {
    const voice_key = document.getElementById('voice').value;
    const text      = document.getElementById('text').value.trim();
    const speed     = parseFloat(document.getElementById('speed').value || '1');
    const tau       = parseFloat(document.getElementById('tau').value || '3.0');
    const nfe_step  = parseInt(document.getElementById('nfe').value || '16', 10);
    const playback  = document.getElementById('playback').value;
    if (!text) { toast('Enter some text first', 'bad'); return; }
    synthBtn.disabled = true; synthBtn.textContent = 'Synthesizing…';
    sub.textContent = '';
    timing.textContent = '';
    wrap.style.display = '';

    const t0 = performance.now();
    let firstChunkAt = null;
    let totalChunks = 0;
    let receivedChunks = 0;

    const queue = [];       // wav URLs waiting to play in order
    let playingIdx = -1;    // -1 = nothing playing
    let streamDone = false;
    let serverErr = null;

    function playNext() {
      if (playingIdx >= 0 || queue.length === 0) return;
      const item = queue.shift();
      playingIdx = item.index;
      player.src = item.wav_url + '?t=' + Date.now();
      player.play().catch(() => {});
    }
    player.onended = () => {
      playingIdx = -1;
      if (queue.length > 0) {
        playNext();
      } else if (streamDone) {
        // all chunks played, all chunks delivered, we're done
        synthBtn.disabled = false; synthBtn.textContent = 'Synthesize';
      }
    };

    // Build the SSE URL — endpoint is GET so query params
    const qs = new URLSearchParams({
      voice_key, text, speed, tau, nfe_step,
    });
    const es = new EventSource(`/api/speak/stream?${qs.toString()}`);

    es.addEventListener('plan', (e) => {
      try {
        const data = JSON.parse(e.data);
        totalChunks = data.chunks || 0;
        sub.textContent = `synthesizing ${totalChunks} chunk(s)…`;
      } catch (_) {}
    });

    es.addEventListener('chunk', (e) => {
      try {
        const data = JSON.parse(e.data);
        receivedChunks += 1;
        if (firstChunkAt === null) {
          firstChunkAt = (performance.now() - t0) / 1000;
          timing.textContent = `first audio in ${firstChunkAt.toFixed(2)}s`;
        }
        queue.push({index: data.index, wav_url: data.wav_url});
        sub.textContent =
          `chunk ${receivedChunks}/${totalChunks} ready (server ${data.elapsed.toFixed(2)}s, audio ${data.seconds.toFixed(2)}s, rtf ${data.rtf.toFixed(2)})`;

        // Jetson-side playback (fire and forget per chunk)
        if (playback === 'jetson' || playback === 'both') {
          const wavName = data.wav_url.split('/').pop();
          postJSON('/api/play/local', {wav_name: wavName}).catch(() => {});
        }
        // Browser playback starts as soon as we have something queued
        if (playback === 'browser' || playback === 'both') {
          playNext();
        }
      } catch (_) {}
    });

    es.addEventListener('done', () => {
      streamDone = true;
      es.close();
      // If queue is empty and nothing's playing, we can re-enable now
      if (playingIdx < 0 && queue.length === 0) {
        synthBtn.disabled = false; synthBtn.textContent = 'Synthesize';
      }
    });

    es.addEventListener('error', (e) => {
      // SSE error or stream closed unexpectedly
      es.close();
      if (!streamDone && receivedChunks === 0) {
        toast('streaming synth failed — check server logs', 'bad');
      }
      synthBtn.disabled = false; synthBtn.textContent = 'Synthesize';
    });
  });

  warmBtn?.addEventListener('click', async () => {
    warmBtn.disabled = true; warmBtn.textContent = 'warming…';
    try {
      await postJSON('/api/warmup', {});
      toast('Warmup started — first synth will be fast in ~15 s');
    } catch (e) {
      toast(e.message || String(e), 'bad');
    } finally {
      // a real "ready" comes via SSE; for now just re-enable after a beat
      setTimeout(() => { warmBtn.disabled = false; warmBtn.textContent = 'warm up models'; }, 1000);
    }
  });
</script>
{% endblock %}
