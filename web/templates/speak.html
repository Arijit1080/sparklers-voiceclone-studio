{% extends "_base.html" %}
{% block content %}
<div class="card">
  <h2>Speak</h2>
  {% if not voices %}
  <p class="muted">No voices enrolled yet. <a href="/enroll">Enroll one first →</a></p>
  {% else %}
  <div class="row">
    <div class="col" style="flex-basis:320px">
      <label for="voice">Voice</label>
      <select id="voice">
        {% for v in voices %}
        <option value="{{ v.key }}">{{ v.display_name }} ({{ v.key }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col" style="flex-basis:160px">
      <label for="tau">Guidance (cfg)</label>
      <input id="tau" type="number" min="0.5" max="6.0" step="0.5" value="3.0">
      <span class="small muted">Higher = closer to you</span>
    </div>
    <div class="col" style="flex-basis:220px">
      <label for="nfe">NFE steps (speed ↔ quality)</label>
      <select id="nfe">
        <option value="12"          > 12 — fastest ⚡⚡⚡</option>
        <option value="16" selected > 16 — best balance ⭐ (first chunk forced to 12 for ~2s TTfA)</option>
        <option value="20"          > 20</option>
        <option value="24"          > 24</option>
        <option value="32"          > 32 — slow</option>
        <option value="48"          > 48 — slowest, best</option>
      </select>
    </div>
    <div class="col" style="flex-basis:120px">
      <label for="speed">Speed</label>
      <input id="speed" type="number" min="0.5" max="2.0" step="0.05" value="1.0">
    </div>
    <div class="col" style="flex-basis:160px">
      <label for="playback">Play on</label>
      <select id="playback">
        <option value="browser" selected>Mac (browser)</option>
        <option value="jetson">Jetson speaker</option>
        <option value="both">Both</option>
      </select>
    </div>
    <div class="col" style="flex-basis:200px">
      <label for="chunkmode">Chunking</label>
      <select id="chunkmode">
        <option value="smart" selected>Smooth (gapless, ~2.6s start)</option>
        <option value="sentence">Per sentence (natural, may gap)</option>
      </select>
    </div>
  </div>

  <div style="margin-top:14px">
    <label for="text">Text</label>
    <textarea id="text" maxlength="1000"
      placeholder="Hello from the Jetson Orin Nano. This is a voice clone smoke test."></textarea>
  </div>

  <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
    <button id="synth" class="btn">Synthesize</button>
    <button id="warmup" class="btn secondary small" title="preload MeloTTS + Converter so the first synth is fast">
      warm up models
    </button>
    <span id="timing" class="small muted"></span>
  </div>

  <div id="player-wrap" style="margin-top:18px; display:none">
    <label>Result</label>
    <audio id="player" controls style="width:100%"></audio>
    <p class="small muted" id="player-sub"></p>
  </div>
  {% endif %}
</div>
{% endblock %}

{% block scripts %}
<script>
  // Pre-select voice from ?voice= query param
  const params = new URLSearchParams(location.search);
  const wantedVoice = params.get('voice');
  if (wantedVoice) {
    const sel = document.getElementById('voice');
    if (sel) for (const opt of sel.options) {
      if (opt.value === wantedVoice) { sel.value = wantedVoice; break; }
    }
  }

  const synthBtn = document.getElementById('synth');
  const warmBtn  = document.getElementById('warmup');
  const player   = document.getElementById('player');
  const wrap     = document.getElementById('player-wrap');
  const sub      = document.getElementById('player-sub');
  const timing   = document.getElementById('timing');

  async function postJSON(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({detail: r.statusText}));
      throw new Error(e.detail || r.statusText);
    }
    return r.json();
  }

  // Streaming synth — SSE endpoint yields per-chunk wav_urls.  We
  // queue them and play them back-to-back, so the very first audio
  // starts within ~2 s while later chunks render in the background.
  synthBtn?.addEventListener('click', async () => {
    const voice_key = document.getElementById('voice').value;
    const text      = document.getElementById('text').value.trim();
    const speed     = parseFloat(document.getElementById('speed').value || '1');
    const tau       = parseFloat(document.getElementById('tau').value || '3.0');
    const nfe_step  = parseInt(document.getElementById('nfe').value || '16', 10);
    const playback  = document.getElementById('playback').value;
    const chunkMode = document.getElementById('chunkmode').value;
    if (!text) { toast('Enter some text first', 'bad'); return; }
    synthBtn.disabled = true; synthBtn.textContent = 'Synthesizing…';
    sub.textContent = '';
    timing.textContent = '';
    wrap.style.display = '';

    const t0 = performance.now();
    let firstChunkAt = null;
    let totalChunks = 0;
    let receivedChunks = 0;
    let streamDone = false;

    // ---- Web Audio gapless player ----
    // Chaining <audio> elements (src=...; onended->next) has an
    // inherent gap: the browser fetches+decodes the next clip only
    // after the previous ends.  Instead we decode each chunk to an
    // AudioBuffer and BUTT-JOIN them on the AudioContext clock: chunk
    // N+1 starts exactly when chunk N ends, no overlap.  (A crossfade
    // would superimpose two DIFFERENT chunks during the overlap, which
    // sounds like a collapse/blur — wrong for non-overlapping speech.)
    // The server already fades each chunk's edges to zero, so the
    // butt-join is click-free and seamless.
    const useBrowser = (playback === 'browser' || playback === 'both');
    let audioCtx = null;
    let playHead = 0;            // ctx time where the next chunk starts
    let scheduleChain = Promise.resolve();   // serialize in index order
    let scheduledEnd = 0;        // ctx time the last chunk finishes
    let started = false;
    const collected = [];        // {index, wav_url} for download/replay

    function ensureCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function scheduleChunk(wavUrl) {
      scheduleChain = scheduleChain.then(async () => {
        const ctx = ensureCtx();
        const arr = await (await fetch(wavUrl)).arrayBuffer();
        const buf = await ctx.decodeAudioData(arr);
        const now = ctx.currentTime;
        let start;
        if (!started) {
          start = now + 0.06;           // first chunk: tiny lead-in
          started = true;
        } else {
          // butt-join: continue exactly where the last chunk ends.  If
          // decode ran late and we're already past that point, start now
          // (a small gap is the worst case — never an overlap).
          start = Math.max(playHead, now + 0.01);
        }
        const dur = buf.duration;

        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);   // flat gain — no crossfade
        src.start(start);

        playHead = start + dur;
        scheduledEnd = start + dur;
      }).catch((e) => console.error('schedule failed', e));
    }

    // Build the SSE URL — endpoint is GET so query params.  `playback`
    // is passed so the SERVER does Jetson-speaker playback sequentially
    // (one persistent aplay), instead of the client firing one aplay per
    // chunk (which overlapped).
    const qs = new URLSearchParams({
      voice_key, text, speed, tau, nfe_step, chunk_mode: chunkMode,
      playback,
    });
    const es = new EventSource(`/api/speak/stream?${qs.toString()}`);

    es.addEventListener('plan', (e) => {
      try {
        const data = JSON.parse(e.data);
        totalChunks = data.chunks || 0;
        sub.textContent = `synthesizing ${totalChunks} chunk(s)…`;
      } catch (_) {}
    });

    es.addEventListener('chunk', (e) => {
      try {
        const data = JSON.parse(e.data);
        receivedChunks += 1;
        if (firstChunkAt === null) {
          firstChunkAt = (performance.now() - t0) / 1000;
          timing.textContent = `first audio in ${firstChunkAt.toFixed(2)}s`;
        }
        collected.push({index: data.index, wav_url: data.wav_url});
        sub.textContent =
          `chunk ${receivedChunks}/${totalChunks} ready (server ${data.elapsed.toFixed(2)}s, audio ${data.seconds.toFixed(2)}s, rtf ${data.rtf.toFixed(2)})`;

        // Jetson-speaker playback is handled SERVER-SIDE now (sequential
        // single-aplay), so the client no longer fires per-chunk aplay.
        // Browser: decode + schedule this chunk gaplessly via Web Audio.
        if (useBrowser) scheduleChunk(data.wav_url);
      } catch (_) {}
    });

    function finish() {
      // also expose the full audio in the <audio> element for replay/
      // download once everything is in (first chunk for now; the
      // gapless playback above is what the user actually hears live).
      if (collected.length) {
        player.src = collected[0].wav_url + '?t=' + Date.now();
      }
      synthBtn.disabled = false; synthBtn.textContent = 'Synthesize';
    }

    es.addEventListener('done', () => {
      streamDone = true;
      es.close();
      // wait for the last scheduled chunk to actually finish before
      // re-enabling, so the button reflects playback state
      scheduleChain.then(() => {
        const ctx = audioCtx;
        const remain = ctx ? Math.max(0, (scheduledEnd - ctx.currentTime) * 1000) : 0;
        setTimeout(finish, useBrowser ? remain + 100 : 0);
      });
    });

    es.addEventListener('error', () => {
      es.close();
      if (!streamDone && receivedChunks === 0) {
        toast('streaming synth failed — check server logs', 'bad');
      }
      synthBtn.disabled = false; synthBtn.textContent = 'Synthesize';
    });
  });

  warmBtn?.addEventListener('click', async () => {
    warmBtn.disabled = true; warmBtn.textContent = 'warming…';
    // Disable Synthesize until the model is fully loaded — synthesizing
    // mid-warmup would 409 (service busy) or queue behind it.
    synthBtn.disabled = true; synthBtn.textContent = 'warming up…';
    try {
      await postJSON('/api/warmup', {});
      toast('Warming up models — please wait…');
    } catch (e) {
      toast(e.message || String(e), 'bad');
      warmBtn.disabled = false; warmBtn.textContent = 'warm up models';
      synthBtn.disabled = false; synthBtn.textContent = 'Synthesize';
      return;
    }
    // Poll status until the warmup job finishes (busy clears + job done),
    // then re-enable both buttons.
    const poll = setInterval(async () => {
      try {
        const r = await fetch('/api/status');
        const s = await r.json();
        const job = s.job || {};
        const done = (s.busy_with === null || s.busy_with === undefined) &&
                     (job.kind !== 'warmup' || job.state === 'done' || job.state === 'error');
        if (done) {
          clearInterval(poll);
          warmBtn.disabled = false; warmBtn.textContent = 'warm up models';
          synthBtn.disabled = false; synthBtn.textContent = 'Synthesize';
          if (job.state === 'error') toast('Warmup failed — check server logs', 'bad');
          else toast('Models ready — synth will be fast now');
        }
      } catch (_) { /* keep polling */ }
    }, 1000);
  });
</script>
{% endblock %}
